name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desfire-tool-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MifareDesfireTool-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" \
            "MifareDesfireTool-${GITHUB_REF_NAME}.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes "NFC analysis toolkit fork of the Mifare Desfire Tool.

          Features (overflow menu):
          - Run Script: raw APDUs + high-level SELECT / AUTH / READ / CHFILESETTINGS via nfcjlib (AES session)
          - Dict Attack: brute-force a .dic AES wordlist against a key slot
          - Dump + Restore: read a protected file via the Change key, then restore and verify the original settings
          - Ecran noir: optional AMOLED fake-sleep that keeps NFC alive
          - Armed actions, screen kept on, silent scan (no beep/vibration), MIUI stale-tag crash fix

          Debug-signed APK; install over any previous build. Educational use on your own cards only." \
          || gh release upload "${GITHUB_REF_NAME}" "MifareDesfireTool-${GITHUB_REF_NAME}.apk" --clobber
